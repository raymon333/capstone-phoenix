---
- name: Download and install k3s server
  shell: |
    curl -sfL https://get.k3s.io | sh -s - server \
      --write-kubeconfig-mode 644 \
      --tls-san {{ ansible_host }}
  args:
    creates: /usr/local/bin/k3s

- name: Wait for node-token to exist
  wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    state: present

- name: Fetch node token
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: node_token_raw

- name: Set node token fact
  set_fact:
    k3s_node_token: "{{ node_token_raw.content | b64decode | trim }}"

- name: Fetch kubeconfig locally
  fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /tmp/k3s.yaml
    flat: yes