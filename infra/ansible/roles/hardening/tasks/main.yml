---
- name: Ensure UFW is installed
  apt:
    name: ufw
    state: present
    update_cache: yes

- name: Allow SSH
  ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow HTTP
  ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPS
  ufw:
    rule: allow
    port: "443"
    proto: tcp
- name: Allow k3s API from internal subnet only
  ufw:
    rule: allow
    port: "6443"
    proto: tcp
    src: "10.10.1.0/24"

- name: Allow Flannel VXLAN from internal subnet only
  ufw:
    rule: allow
    port: "8472"
    proto: udp
    src: "10.10.1.0/24"

- name: Allow kubelet API from internal subnet only
  ufw:
    rule: allow
    port: "10250"
    proto: tcp
    src: "10.10.1.0/24"
    
- name: Enable UFW
  ufw:
    state: enabled
    policy: deny

- name: Install fail2ban
  apt:
    name: fail2ban
    state: present

- name: Ensure fail2ban is running
  service:
    name: fail2ban
    state: started
    enabled: yes